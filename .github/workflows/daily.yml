name: daily-aggregate
on:
  schedule:
    - cron: '23 21 * * *'   # 每天 UTC 21:23（北京 05:23）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python aggregate.py
      - name: commit
        run: |
          git config user.name "iptv-bot"
          git config user.email "bot@users.noreply.github.com"
          git add iptv.m3u
          git diff --cached --quiet || git commit -m "daily: $(date -u +%F) aggregate"
          git push
