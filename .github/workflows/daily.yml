name: daily-aggregate
on:
  schedule:
    - cron: '23 9,21 * * *'   # 每天 UTC 21:23（北京 05:23）
  workflow_dispatch:

concurrency:
  group: iptv-aggregate   # 串行化所有运行，杜绝 CI 互撞
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: python aggregate.py
      - name: sanitize and guard artifact
        run: |
          sed -i -E '/^(<<<<<<<|>>>>>>>|=======)$/d; /^(<<<<<<< |>>>>>>> )/d' iptv.m3u || true
          if grep -nE '^(<<<<<<<|>>>>>>>|=======)$|^(<<<<<<< |>>>>>>> )' iptv.m3u; then
            echo "::error::iptv.m3u 仍含冲突标记，拒绝发布"; exit 1
          fi
      - name: commit
        run: |
          git config user.name "iptv-bot"
          git config user.email "bot@users.noreply.github.com"
          git config merge.ours.driver true
          git pull --rebase --autostash origin main
          git add iptv.m3u
          git diff --cached --quiet || git commit -m "daily: $(date -u +%F) aggregate"
          git push
      - name: purge cdn
        run: curl -sf https://purge.jsdelivr.net/gh/xinghui/iptv-daily@main/iptv.m3u -o /dev/null || true
